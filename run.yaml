# AIntropy Evaluation Runner Configuration
# Grader Bot runs these commands exactly as written, in this order, from a fresh checkout.
# Keep every command non-interactive and idempotent.

setup_commands:
  - "pip install -r requirements.txt"

run_commands:
  - "python src/main.py --help"
  - "python src/main.py analyze-conversion --dry-run"

test_commands:
  - "pytest tests/ -v"

notes: "Task 3: Metadata-Driven Lossy Video Conversion & Break-Even Analytical ROI Engine."
